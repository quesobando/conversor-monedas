name: Acceptance tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/acceptance.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Karate (API + Postgres + mock de Frankfurter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Levantar dependencias (Postgres + WireMock)
        run: docker compose -f acceptance/docker-compose.yml up -d --wait

      - name: Esperar al mock de Frankfurter
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/__admin/mappings > /dev/null && exit 0
            sleep 1
          done
          echo "WireMock no respondió"
          docker compose -f acceptance/docker-compose.yml logs wiremock
          exit 1

      - name: Construir la aplicación
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: Arrancar la aplicación contra el entorno de aceptación
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/conversor
          SPRING_DATASOURCE_USERNAME: conversor
          SPRING_DATASOURCE_PASSWORD: conversor
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          FRANKFURTER_BASE_URL: http://localhost:8081/v1
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/currencies > /dev/null && exit 0
            sleep 2
          done
          echo "La aplicación no arrancó"
          tail -n 100 app.log
          exit 1

      - name: Ejecutar pruebas de aceptación (Karate)
        run: ./gradlew acceptanceTest -DbaseUrl=http://localhost:8080

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: |
            backend/build/karate-reports
            backend/build/reports/tests/acceptanceTest
            backend/app.log
          retention-days: 14

      - name: Apagar la aplicación y el entorno
        if: always()
        run: |
          kill "$(cat app.pid)" 2>/dev/null || true
          docker compose -f acceptance/docker-compose.yml down -v
