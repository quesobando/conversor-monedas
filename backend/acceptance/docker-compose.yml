# Dependencias del entorno de aceptación: Postgres efímero + mock de Frankfurter.
# La aplicación NO corre aquí: se arranca aparte (bootRun / java -jar) apuntando a estos servicios.
name: conversor-acceptance

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conversor
      POSTGRES_USER: conversor
      POSTGRES_PASSWORD: conversor
    ports:
      - "5433:5432"          # 5433 en el host para no chocar con un Postgres local
    tmpfs:
      - /var/lib/postgresql/data   # datos efímeros: cada corrida empieza limpia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conversor -d conversor"]
      interval: 3s
      timeout: 3s
      retries: 20

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8081:8080"          # el mock de Frankfurter queda en http://localhost:8081
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--verbose"]
